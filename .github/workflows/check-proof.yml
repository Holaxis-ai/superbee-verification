name: Check journal proof (manual experiment)
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Select the isolated verification experiment
        type: choice
        default: lean
        options:
          - lean
          - settlement
          - retry
          - protocol
          - rocq
          - rocq-cycle
          - retirement-production
      cycle_candidate:
        description: Candidate selection for manual Rocq work cycle only
        type: choice
        default: final
        options:
          - initial
          - final
          - controls
permissions:
  contents: read
jobs:
  check:
    if: ${{ inputs.experiment == 'lean' || inputs.experiment == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Lean; no libraries or automatic build
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # reviewed v1 commit
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Install the selected toolchain (cold setup measured separately)
        run: elan toolchain install leanprover/lean4:v4.27.0
      - name: Clean proof, axiom audit and expected rejection
        run: python3 scripts/check.py --json-out .artifacts/check.json
  source-bridge:
    if: ${{ inputs.experiment == 'lean' || inputs.experiment == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the pinned public product source; do not install or build it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Holaxis-ai/superbee
          ref: a63eef111001974a89ce35a83759bbe183814a1c
          path: .artifacts/product-source
          sparse-checkout: packages/core/src/uncertain-write.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Install the experiment's pinned parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Set up pinned Lean without automatic build or library caches
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # reviewed v1 commit
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Check byte decoding, source-derived claims, replay and mutations
        run: python3 scripts/check_source_decode.py --source-file .artifacts/product-source/packages/core/src/uncertain-write.ts --json-out .artifacts/bridge-result.json
  settlement:
    if: ${{ inputs.experiment == 'settlement' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read exact public product source without installing or building it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Holaxis-ai/superbee
          ref: a63eef111001974a89ce35a83759bbe183814a1c
          path: .artifacts/product-source
          sparse-checkout: packages/core/src/uncertain-write.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
      - name: Install the experiment's pinned TypeScript compiler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch and verify pinned local Gillian and Z3 tools
        run: python3 scripts/setup_gillian.py --dir .artifacts/gillian-tools --pin experiments/gillian-settlement/toolchain.json
      - name: Verify contracts, genuine mutants and equivalent changed code
        run: >-
          python3 scripts/check_settlement.py
          --source-file .artifacts/product-source/packages/core/src/uncertain-write.ts
          --tool-dir .artifacts/gillian-tools
          --json-out .artifacts/settlement-result.json
          --evidence-dir .artifacts/settlement-evidence
  retry:
    if: ${{ inputs.experiment == 'retry' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read pinned retry source without installing or building product code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Holaxis-ai/superbee
          ref: 6092eaf6d16c8bf2c25d526cbbb768cfa07e9b72
          path: .artifacts/retry-source
          sparse-checkout: packages/core/src/blob-journal.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read historical settlement source for shared-tool regression
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Holaxis-ai/superbee
          ref: a63eef111001974a89ce35a83759bbe183814a1c
          path: .artifacts/settlement-source
          sparse-checkout: packages/core/src/uncertain-write.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
      - name: Install the experiment's existing pinned TypeScript compiler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify and extract existing pinned Gillian and Z3 archives
        run: python3 scripts/setup_gillian.py --dir .artifacts/gillian-tools --pin experiments/gillian-settlement/toolchain.json
      - name: Verify complete safe retry admission, mutants and equivalence
        run: >-
          python3 scripts/check_retry.py
          --source-file .artifacts/retry-source/packages/core/src/blob-journal.ts
          --tool-dir .artifacts/gillian-tools
          --json-out .artifacts/retry-result.json
          --evidence-dir .artifacts/retry-evidence
      - name: Recheck settlement through shared tool validation
        run: >-
          python3 scripts/check_settlement.py
          --source-file .artifacts/settlement-source/packages/core/src/uncertain-write.ts
          --tool-dir .artifacts/gillian-tools
          --json-out .artifacts/settlement-regression.json
  protocol:
    if: ${{ inputs.experiment == 'protocol' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read frozen protocol owners without building product code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Holaxis-ai/superbee
          ref: 6092eaf6d16c8bf2c25d526cbbb768cfa07e9b72
          path: .artifacts/protocol-source
          sparse-checkout: |
            packages/core/src/blob-journal.ts
            packages/core/src/hosted-client/blob-write.ts
            packages/core/src/hosted-client/blob-delivery.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify the existing pinned TLC release
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check --strict
      - name: Check bounded retry protocol, recovery and negative controls
        run: >-
          python3 scripts/check_retry_protocol.py
          --tlc-jar "$RUNNER_TEMP/tla2tools.jar"
          --source-root .artifacts/protocol-source
          --json-out .artifacts/protocol-result.json
          --evidence-dir .artifacts/protocol-evidence

  rocq:
    if: ${{ inputs.experiment == 'rocq' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: rocq-capability-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read only the pinned upstream core and tiny binary controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: theorem-labs/oss-verify-proofs
          ref: 98e995d4daced70a0a4aa2c810854b88720735f1
          path: .artifacts/rocq-upstream
          sparse-checkout: |
            /dune-project
            /LICENSE
            /release.yaml
            /docs/checking.md
            /theories/
            /tests/
            /toolchain/allowed-axioms.txt
            /toolchain/checker.Dockerfile
            /toolchain/toolchain.lock
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false
      - name: Verify upstream revision and acquire only the exact public checker
        run: |
          git -C .artifacts/rocq-upstream rev-parse HEAD > .artifacts/rocq-upstream-revision.txt
          test "$(cat .artifacts/rocq-upstream-revision.txt)" = 98e995d4daced70a0a4aa2c810854b88720735f1
          timeout 600s docker pull ghcr.io/theorem-labs/oss-fuzz-theorems-checker@sha256:cc9ae43a9f4b0dd59d7c8d30727d36e039bfe72a2a9f9c4a99c68e413037e902
      - name: Run unchanged upstream controls offline with bounded resources
        run: >-
          python3 scripts/check_rocq_capability.py
          --source-root .artifacts/rocq-upstream
          --evidence-dir .artifacts/rocq-evidence
          --json-out .artifacts/rocq-result.json
          --container-name superbee-rocq-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove the named container after failure or cancellation
        if: ${{ always() }}
        run: docker rm -f superbee-rocq-${{ github.run_id }}-${{ github.run_attempt }} 2>/dev/null || true
      - name: Retain reports and control audits, excluding the build cache
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rocq-capability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/rocq-upstream-revision.txt
            .artifacts/rocq-result.json
            .artifacts/rocq-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  rocq-cycle:
    if: ${{ inputs.experiment == 'rocq-cycle' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: rocq-work-cycle-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Acquire only the exact published checker
        run: timeout 600s docker pull ghcr.io/theorem-labs/oss-fuzz-theorems-checker@sha256:cc9ae43a9f4b0dd59d7c8d30727d36e039bfe72a2a9f9c4a99c68e413037e902
      - name: Check one candidate or three explicit admission controls
        env:
          CYCLE_CANDIDATE: ${{ inputs.cycle_candidate }}
          CONTAINER_PREFIX: superbee-rocq-cycle-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p .artifacts/rocq-cycle
          case "$CYCLE_CANDIDATE" in
            initial) candidate=experiments/rocq-retirement/Initial.v ;;
            final) candidate=experiments/rocq-retirement/Proof.v ;;
            controls)
              for control in admitted extra_axiom wrong_statement; do
                python3 scripts/check_rocq_work_cycle.py \
                  --candidate "experiments/rocq-work-cycle/controls/$control.v" \
                  --ledger .artifacts/rocq-cycle/ledger.json \
                  --evidence-root .artifacts/rocq-cycle/attempts \
                  --json-out ".artifacts/rocq-cycle/$control.json" \
                  --container-name "$CONTAINER_PREFIX-$control" || true
                python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["status"] == "rejected" and r["native_checks_run"], r' ".artifacts/rocq-cycle/$control.json"
              done
              exit 0 ;;
            *) echo 'Unknown explicit candidate selection' >&2; exit 2 ;;
          esac
          python3 scripts/check_rocq_work_cycle.py \
            --candidate "$candidate" \
            --ledger .artifacts/rocq-cycle/ledger.json \
            --evidence-root .artifacts/rocq-cycle/attempts \
            --json-out .artifacts/rocq-cycle/result.json \
            --container-name "$CONTAINER_PREFIX-candidate"
      - name: Remove only this run's named candidate containers
        if: ${{ always() }}
        run: |
          for suffix in candidate admitted extra_axiom wrong_statement; do
            docker rm -f superbee-rocq-cycle-${{ github.run_id }}-${{ github.run_attempt }}-$suffix 2>/dev/null || true
          done
      - name: Retain every candidate attempt and diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rocq-work-cycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/rocq-cycle/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  retirement-production:
    if: ${{ inputs.experiment == 'retirement-production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: production-retirement-pilot-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the exact product implementation without repository credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Holaxis-ai/superbee
          ref: 2d856c492f146a14e71ee2aafac3f4bc593fe942
          path: .artifacts/production-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
      - name: Install and build the frozen product normally
        working-directory: .artifacts/production-source
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Acquire only the exact published Rocq checker
        run: timeout 600s docker pull ghcr.io/theorem-labs/oss-fuzz-theorems-checker@sha256:cc9ae43a9f4b0dd59d7c8d30727d36e039bfe72a2a9f9c4a99c68e413037e902
      - name: Observe actual adapters and check finite correspondences
        env:
          RETIREMENT_RUN_LABEL: ${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python3 scripts/check_production_retirement.py
          --source-root .artifacts/production-source
          --evidence-dir .artifacts/production-retirement/evidence
          --json-out .artifacts/production-retirement/result.json
      - name: Remove only this job's proof containers after cancellation
        if: ${{ always() }}
        run: |
          docker ps -aq --filter "label=superbee.production-retirement=${{ github.run_id }}-${{ github.run_attempt }}" | xargs -r docker rm -f
      - name: Retain exact observations, projections, source controls and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-retirement-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/production-retirement/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
